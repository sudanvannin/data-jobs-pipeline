data_jobs_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'airflow') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'airflow') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      search_path: "public"
      
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST_PROD', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER_PROD', 'airflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD_PROD', 'airflow') }}"
      port: "{{ env_var('POSTGRES_PORT_PROD', 5432) | int }}"
      dbname: "{{ env_var('POSTGRES_DB_PROD', 'airflow') }}"
      schema: public
      threads: 8
      keepalives_idle: 0
      search_path: "public"
